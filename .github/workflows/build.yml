name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint-js

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build:
    runs-on: ubuntu-latest
    needs: [php-cs-fixer, eslint, phpunit]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Composer Install
        run: composer install --no-dev --no-suggest --optimize-autoloader --no-interaction

      - name: Set Version in PHP File
        run: |
          sed -i "s/Version:.*$/Version: ${{ github.ref_name }}/" soccr.php

      - name: Set Stable tag in readme files (stable releases only)
        if: "!contains(github.ref_name, '-')"
        run: |
          sed -i "s/Stable tag:.*$/Stable tag: ${{ github.ref_name }}/" readme.txt readme-de_DE.txt

      - name: zip
        run: bun run plugin-zip

      - name: Copy zip with version suffix
        run: cp soccr.zip soccr-${{ github.ref_name }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            soccr.zip
            soccr-${{ github.ref_name }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            "soccr-${{ github.ref_name }}.zip" \
            soccr.zip

  wporg-assets-trunk:
    name: Push to trunk
    runs-on: ubuntu-latest
    needs: release
    if: "!contains(github.ref_name, '-')"
    steps:
      - uses: actions/checkout@v7
      - name: Update Stable tag
        run: |
          sed -i "s/Stable tag:.*$/Stable tag: ${{ github.ref_name }}/" readme.txt readme-de_DE.txt
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: soccr
          IGNORE_OTHER_FILES: true

  wporg-deploy:
    name: wordpress.org Deploy
    needs: wporg-assets-trunk
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Set version and stable tag
        run: |
          sed -i "s/Version:.*$/Version: ${{ github.ref_name }}/" soccr.php
          sed -i "s/Stable tag:.*$/Stable tag: ${{ github.ref_name }}/" readme.txt readme-de_DE.txt
        shell: bash

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: soccr
